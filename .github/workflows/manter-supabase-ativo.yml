name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Este acesso automático, duas vezes por semana, evita a pausa.
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o banco
        run: |
          curl -sS -o /dev/null -w "Supabase respondeu %{http_code}\n" \
            "https://prwslwhafpqzelukuknu.supabase.co/rest/v1/galerias?select=id&limit=1" \
            -H "apikey: sb_publishable_AJpc5jBjgzdcCrZ0A_ONMA_791ZtpVx"
